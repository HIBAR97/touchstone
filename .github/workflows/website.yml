# Builds the site and publishes it with GitHub Pages (Settings > Pages > Source: GitHub Actions).
# `--release` fails while website/site.config.json still has an empty owner value, so nothing half-finished goes live.
name: website
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node website/build.mjs --release
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
