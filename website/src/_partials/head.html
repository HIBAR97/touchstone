<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
{{#if page.noindex}}<meta name="robots" content="noindex">
{{/if}}<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3EEE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121115" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{page.url}}">
{{#each alternates}}<link rel="alternate" hreflang="{{hreflang}}" href="{{href}}">
{{/each}}<meta property="og:type" content="website">
<meta property="og:site_name" content="Touchstone">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:locale" content="{{t.locale}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{page.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">
<link rel="icon" href="{{root}}favicon.ico" sizes="48x48">
<link rel="icon" href="{{root}}assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{root}}assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
